# CI for the Linux (PC) side of Parking-System.
#
# What it checks on every push to main and on every pull request:
#   1. Build: all Linux programs and library tests compile.
#   2. Smoke tests: the library test programs run, exit with 0 and do not hang.
# Both are done twice: a normal build, and a build with AddressSanitizer +
# UndefinedBehaviorSanitizer (memory errors, leaks, undefined behavior).
#
# Not covered here (needs the real boards): STM32 firmware, BbgClient over I2C.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  pc-build-and-smoke-tests:
    name: Linux PC - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false        # one red variant must not stop the other
      matrix:
        include:
          - name: build and smoke tests
            cc: gcc
            cxx: g++
          - name: ASan + UBSan
            # The Makefiles are not changed: the compiler command itself
            # carries the sanitizer flags (used for compiling and linking).
            cc: gcc -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g
            cxx: g++ -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g

    env:
      CC_CMD: ${{ matrix.cc }}
      CXX_CMD: ${{ matrix.cxx }}
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # ---------- 1. Build ----------
      - name: Build libraries
        run: |
          make -C Libraries/Logger         CC="$CC_CMD" CXX="$CXX_CMD"
          make -C Libraries/Config         CC="$CC_CMD" CXX="$CXX_CMD"
          make -C Libraries/SharedMemory   CC="$CC_CMD" CXX="$CXX_CMD"
          make -C Libraries/Queue          CC="$CC_CMD" CXX="$CXX_CMD"
          make -C Libraries/SQLiteDatabase CC="$CC_CMD" CXX="$CXX_CMD"

      - name: Build applications
        run: |
          make -C TcpServer    CC="$CC_CMD" CXX="$CXX_CMD"
          make -C Database     CC="$CC_CMD" CXX="$CXX_CMD"
          make -C PriceUpdater CC="$CC_CMD" CXX="$CXX_CMD"
          make -C BbgClient    CC="$CC_CMD" CXX="$CXX_CMD"

      # ---------- 2. Smoke tests ----------
      # The programs write their logs to <repo>/Logs, which is not in git.
      - name: Create Logs directory
        run: mkdir -p Logs

      # Each program runs from its own folder (relative paths), with a time limit.
      - name: Test Logger
        working-directory: Libraries/Logger
        run: timeout 30 ./logger_test

      - name: Test Config
        working-directory: Libraries/Config
        run: timeout 30 ./config_test

      - name: Test SharedMemory
        working-directory: Libraries/SharedMemory
        run: timeout 30 ./shared_memory_test

      - name: Test Queue
        working-directory: Libraries/Queue
        run: timeout 30 ./shared_queue_test

      - name: Test SQLiteDatabase
        working-directory: Libraries/SQLiteDatabase
        run: timeout 30 ./sqlite_database_test
