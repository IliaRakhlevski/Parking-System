<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="aSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1120" height="450" fill="#f8fafc"/>

  <g text-anchor="middle">
    <!-- Row 1 -->
    <rect x="20" y="20" width="300" height="120" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="170" y="62" font-size="24" font-weight="700" fill="#0f172a">STM32 GPS Simulator</text>
    <text x="170" y="90" font-size="18" fill="#475569">STM32F756ZG · C · HAL</text>
    <text x="170" y="118" font-size="18" fill="#1e293b">interrupt-driven I²C slave</text>

    <rect x="410" y="20" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
    <text x="560" y="62" font-size="24" font-weight="700" fill="#0f172a">BeagleBone Green</text>
    <text x="560" y="90" font-size="18" fill="#475569">Embedded Linux · C · systemd</text>
    <text x="560" y="118" font-size="18" fill="#1e293b">2 processes linked by a pipe</text>

    <rect x="800" y="20" width="300" height="120" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="950" y="62" font-size="24" font-weight="700" fill="#0f172a">TCP Server</text>
    <text x="950" y="90" font-size="18" fill="#475569">Linux · C++ · POSIX threads</text>
    <text x="950" y="118" font-size="18" fill="#1e293b">event-driven, select()</text>

    <!-- Row 2 -->
    <rect x="20" y="260" width="300" height="120" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="170" y="302" font-size="24" font-weight="700" fill="#0f172a">PriceUpdater</text>
    <text x="170" y="330" font-size="18" fill="#475569">Linux CLI · C</text>
    <text x="170" y="358" font-size="18" fill="#1e293b">manages cities and prices</text>

    <rect x="410" y="260" width="300" height="120" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
    <text x="560" y="302" font-size="24" font-weight="700" fill="#0f172a">SQLite</text>
    <text x="560" y="330" font-size="18" fill="#475569">cities · tariffs</text>
    <text x="560" y="358" font-size="18" fill="#1e293b">parking sessions</text>

    <rect x="800" y="260" width="300" height="120" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="950" y="302" font-size="24" font-weight="700" fill="#0f172a">Database Process</text>
    <text x="950" y="330" font-size="18" fill="#475569">Linux · C++ · POSIX threads</text>
    <text x="950" y="358" font-size="18" fill="#1e293b">parking logic, cost calculation</text>
  </g>

  <!-- Links -->
  <line x1="324" y1="80" x2="406" y2="80" stroke="#15803d" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <text x="365" y="68" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle">I²C</text>

  <line x1="714" y1="80" x2="796" y2="80" stroke="#1d4ed8" stroke-width="3" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
  <text x="755" y="68" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">TCP/IP</text>

  <line x1="950" y1="144" x2="950" y2="256" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#aPurple)" marker-end="url(#aPurple)"/>
  <text x="936" y="196" font-size="18" font-weight="700" fill="#6d28d9" text-anchor="end">System V shared memory</text>
  <text x="936" y="220" font-size="16" fill="#6d28d9" text-anchor="end">shared queues + semaphores</text>

  <line x1="714" y1="320" x2="796" y2="320" stroke="#334155" stroke-width="3" marker-start="url(#aSlate)" marker-end="url(#aSlate)"/>
  <text x="755" y="308" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">SQL</text>

  <line x1="324" y1="320" x2="406" y2="320" stroke="#334155" stroke-width="3" marker-start="url(#aSlate)" marker-end="url(#aSlate)"/>
  <text x="365" y="308" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">SQL</text>

  <path d="M170,382 L170,428 L950,428 L950,386" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aRed)"/>
  <rect x="490" y="417" width="140" height="22" fill="#f8fafc"/>
  <text x="560" y="434" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">SIGUSR1</text>
</svg>
