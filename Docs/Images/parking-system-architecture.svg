<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="aSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>

  <!-- ============ TCP Server ============ -->
  <rect x="40" y="40" width="400" height="240" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="64" y="82" font-size="26" font-weight="700" fill="#0f172a">TCP Server</text>
  <text x="64" y="108" font-size="17" fill="#475569">C++ · Linux</text>
  <g font-size="17" fill="#1e293b">
    <text x="64" y="148">• Event-driven, multi-client (select())</text>
    <text x="64" y="174">• Receives parking events from BBG</text>
    <text x="64" y="200">• Forwards requests to Database via</text>
    <text x="78" y="224">shared queues, returns responses</text>
    <text x="64" y="250">• Worker threads (POSIX threads)</text>
  </g>

  <!-- ============ BBG Client ============ -->
  <rect x="520" y="30" width="680" height="300" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="860" y="68" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">BBG Client (BeagleBone Green) · C</text>
  <text x="860" y="94" font-size="16" fill="#475569" text-anchor="middle">Embedded Linux · started by systemd · two processes created with fork()</text>

  <rect x="545" y="115" width="280" height="195" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="565" y="148" font-size="20" font-weight="700" fill="#0f172a">TCP process</text>
  <text x="565" y="172" font-size="15" fill="#475569">parent</text>
  <g font-size="16" fill="#1e293b">
    <text x="565" y="208">• Reads events from the pipe</text>
    <text x="565" y="234">• Sends them to TcpServer</text>
    <text x="565" y="260">• Receives responses</text>
  </g>

  <rect x="895" y="115" width="285" height="195" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="915" y="148" font-size="20" font-weight="700" fill="#0f172a">I²C process</text>
  <text x="915" y="172" font-size="15" fill="#475569">child</text>
  <g font-size="16" fill="#1e293b">
    <text x="915" y="208">• Reads GPS coordinates</text>
    <text x="929" y="230">from STM32 (I²C master)</text>
    <text x="915" y="258">• Builds parking events</text>
    <text x="929" y="280">and writes them to the pipe</text>
  </g>

  <!-- pipe: child -> parent -->
  <line x1="893" y1="212" x2="829" y2="212" stroke="#15803d" stroke-width="3" marker-end="url(#aGreen)"/>
  <text x="860" y="200" font-size="15" font-weight="600" fill="#15803d" text-anchor="middle">pipe</text>

  <!-- ============ STM32 ============ -->
  <rect x="1260" y="60" width="300" height="250" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="1410" y="98" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">STM32 GPS Simulator</text>
  <text x="1410" y="124" font-size="16" fill="#475569" text-anchor="middle">NUCLEO-144 · STM32F756ZG</text>
  <text x="1410" y="146" font-size="16" fill="#475569" text-anchor="middle">C · STM32 HAL</text>
  <g font-size="16" fill="#1e293b">
    <text x="1282" y="190">• Simulates a GPS receiver</text>
    <text x="1282" y="216">• Interrupt-driven I²C slave</text>
    <text x="1282" y="242">• Timer-based coordinate</text>
    <text x="1296" y="264">updates</text>
  </g>

  <!-- TCP link -->
  <line x1="444" y1="170" x2="541" y2="170" stroke="#1d4ed8" stroke-width="3" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
  <text x="481" y="158" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">TCP/IP</text>

  <!-- I2C link -->
  <line x1="1184" y1="212" x2="1256" y2="212" stroke="#15803d" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <text x="1230" y="200" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">I²C</text>

  <!-- ============ Shared Memory ============ -->
  <rect x="40" y="360" width="400" height="200" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="64" y="400" font-size="24" font-weight="700" fill="#0f172a">Shared Memory</text>
  <text x="64" y="426" font-size="17" fill="#475569">System V IPC</text>
  <g font-size="17" fill="#1e293b">
    <text x="64" y="466">• Request and response shared queues</text>
    <text x="64" y="492">• Named POSIX semaphores</text>
    <text x="64" y="518">• Created and owned by Database</text>
  </g>

  <line x1="240" y1="284" x2="240" y2="356" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#aPurple)" marker-end="url(#aPurple)"/>
  <line x1="240" y1="564" x2="240" y2="626" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#aPurple)" marker-end="url(#aPurple)"/>

  <!-- ============ Database ============ -->
  <rect x="40" y="630" width="400" height="250" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="64" y="670" font-size="26" font-weight="700" fill="#0f172a">Database Process</text>
  <text x="64" y="696" font-size="17" fill="#475569">C++ · Linux</text>
  <g font-size="17" fill="#1e293b">
    <text x="64" y="734">• Reads requests from shared queues</text>
    <text x="64" y="760">• Worker threads (POSIX threads)</text>
    <text x="64" y="786">• Detects city, calculates parking cost</text>
    <text x="64" y="812">• Writes responses to shared queues</text>
    <text x="64" y="838">• Writes PID file, handles SIGUSR1</text>
  </g>

  <!-- ============ SQLite ============ -->
  <path d="M690,666 L690,834 A110,26 0 0 0 910,834 L910,666" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <ellipse cx="800" cy="666" rx="110" ry="26" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <text x="800" y="752" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">SQLite</text>
  <text x="800" y="780" font-size="15" fill="#475569" text-anchor="middle">parking_cities</text>
  <text x="800" y="802" font-size="15" fill="#475569" text-anchor="middle">parking_sessions</text>

  <line x1="444" y1="755" x2="686" y2="755" stroke="#334155" stroke-width="3" marker-start="url(#aSlate)" marker-end="url(#aSlate)"/>
  <text x="565" y="742" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">SQL read / write</text>
  <line x1="914" y1="755" x2="1156" y2="755" stroke="#334155" stroke-width="3" marker-start="url(#aSlate)" marker-end="url(#aSlate)"/>
  <text x="1035" y="742" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">SQL read / write</text>

  <!-- ============ PriceUpdater ============ -->
  <rect x="1160" y="630" width="400" height="250" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1184" y="670" font-size="26" font-weight="700" fill="#0f172a">PriceUpdater CLI</text>
  <text x="1184" y="696" font-size="17" fill="#475569">C · Linux</text>
  <text x="1184" y="734" font-size="17" fill="#1e293b">• Manages cities and parking prices</text>
  <text x="1184" y="766" font-size="17" font-weight="700" fill="#1e293b">Menu:</text>
  <g font-size="17" fill="#1e293b">
    <text x="1200" y="792">1. Add city</text>
    <text x="1370" y="792">2. Update city price</text>
    <text x="1200" y="818">3. Delete city</text>
    <text x="1370" y="818">4. Exit</text>
  </g>
  <text x="1184" y="854" font-size="17" fill="#1e293b">• Notifies Database via SIGUSR1</text>

  <!-- signal -->
  <path d="M1360,628 L1360,596 L340,596 L340,624" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aRed)"/>
  <text x="850" y="584" font-size="17" font-weight="700" fill="#dc2626" text-anchor="middle">SIGUSR1  (PID read from database.pid)</text>

  <!-- ============ Legend ============ -->
  <rect x="40" y="910" width="1520" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="949" font-size="18" font-weight="700" fill="#0f172a">Legend:</text>
  <g font-size="16" fill="#1e293b">
    <line x1="160" y1="943" x2="224" y2="943" stroke="#1d4ed8" stroke-width="3" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
    <text x="236" y="949">TCP/IP</text>
    <line x1="380" y1="943" x2="444" y2="943" stroke="#15803d" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
    <text x="456" y="949">I²C</text>
    <line x1="580" y1="943" x2="644" y2="943" stroke="#15803d" stroke-width="3" marker-end="url(#aGreen)"/>
    <text x="656" y="949">Unnamed pipe (one-way)</text>
    <line x1="880" y1="943" x2="944" y2="943" stroke="#6d28d9" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#aPurple)" marker-end="url(#aPurple)"/>
    <text x="956" y="949">Shared memory IPC</text>
    <line x1="1130" y1="943" x2="1194" y2="943" stroke="#334155" stroke-width="3" marker-start="url(#aSlate)" marker-end="url(#aSlate)"/>
    <text x="1206" y="949">SQL read / write</text>
    <line x1="1360" y1="943" x2="1424" y2="943" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#aRed)"/>
    <text x="1436" y="949">POSIX signal</text>
  </g>
</svg>
